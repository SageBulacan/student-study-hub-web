<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live voice test</title>
<style>
  body { font-family: -apple-system, sans-serif; padding: 16px; background: #fbf7ef; color: #2f2a24; max-width: 600px; margin: auto; }
  input, select { font-size: 16px; padding: 10px; width: 100%; box-sizing: border-box; border-radius: 10px; border: 1px solid #bbb; margin: 4px 0 10px; background: white; color: #2f2a24; }
  button { font-size: 18px; padding: 14px; border-radius: 14px; border: 1.5px solid #2f2a24; width: 100%; margin: 6px 0; }
  #start { background: #f6d978; } #stop { background: #eee; }
  .box { background: white; border-radius: 12px; padding: 12px; margin: 10px 0; min-height: 40px; font-size: 16px; border: 1px solid #ddd; white-space: pre-wrap; }
  #status { font-weight: 600; } .err { color: #c0392b; } small { color: #777; }
</style>
</head>
<body>
<h2>🗣️ Live voice test</h2>
<label>Your Gemini key (not saved anywhere)</label>
<input id="key" type="password" autocomplete="off" placeholder="Paste your key">
<label>Model</label>
<select id="model">
  <option>gemini-3.1-flash-live-preview</option>
  <option>gemini-2.5-flash-native-audio-latest</option>
  <option>gemini-2.5-flash-native-audio-preview-12-2025</option>
  <option>gemini-3.8-live</option>
</select>
<label><input id="halfDuplex" type="checkbox" checked style="width:auto"> Pause the mic while the AI is speaking (prevents echo)</label>
<button id="start">▶ Start talking</button>
<button id="stop">■ Stop</button>
<div class="box" id="status">Not connected</div>
<div class="box" id="log"><small>Conversation transcript will appear here</small></div>
<small id="info"></small>

<script>
const WS_BASE = 'wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent';
const SYSTEM = 'You are a friendly, patient Japanese conversation partner for a beginner (JLPT N5). ' +
  'Speak slowly in simple Japanese with short sentences, and usually end with a simple question. ' +
  'If the learner makes a mistake, gently say the correct sentence. Never ask for personal information.';

let ws = null, ctx = null, stream = null, processor = null, source = null, sink = null;
let playHead = 0, playing = [], logText = '', lastSpeaker = '';

const $ = (id) => document.getElementById(id);
const setStatus = (t, isErr) => { $('status').textContent = t; $('status').className = 'box' + (isErr ? ' err' : ''); };
$('info').textContent = 'Home-screen mode: ' + ((navigator.standalone || matchMedia('(display-mode: standalone)').matches) ? 'yes' : 'no') +
  ' · ' + navigator.userAgent;

function addLog(speaker, text) {
  if (!text) return;
  if (speaker !== lastSpeaker) { logText += (logText ? '\n' : '') + speaker + ': '; lastSpeaker = speaker; }
  logText += text;
  $('log').textContent = logText;
}

function toBase64(bytes) {
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}

// Float32 at the device rate -> 16 kHz little-endian 16-bit PCM.
function to16kPcm(input, inRate) {
  const ratio = inRate / 16000;
  const outLen = Math.floor(input.length / ratio);
  const out = new Int16Array(outLen);
  for (let i = 0; i < outLen; i++) {
    const start = Math.floor(i * ratio), end = Math.min(input.length, Math.floor((i + 1) * ratio));
    let sum = 0;
    for (let j = start; j < end; j++) sum += input[j];
    const v = Math.max(-1, Math.min(1, sum / Math.max(1, end - start)));
    out[i] = v < 0 ? v * 0x8000 : v * 0x7fff;
  }
  return new Uint8Array(out.buffer);
}

function aiSpeaking() { return ctx && playHead > ctx.currentTime + 0.05; }

// 24 kHz 16-bit PCM from Gemini -> scheduled playback.
function playPcm(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const samples = new Int16Array(bytes.buffer, 0, Math.floor(bytes.length / 2));
  const buf = ctx.createBuffer(1, samples.length, 24000);
  const ch = buf.getChannelData(0);
  for (let i = 0; i < samples.length; i++) ch[i] = samples[i] / 0x8000;
  const node = ctx.createBufferSource();
  node.buffer = buf;
  node.connect(ctx.destination);
  playHead = Math.max(playHead, ctx.currentTime + 0.05);
  node.start(playHead);
  playHead += buf.duration;
  playing.push(node);
  node.onended = () => { playing = playing.filter(n => n !== node); };
}

function stopPlayback() {
  playing.forEach(n => { try { n.stop(); } catch (e) {} });
  playing = [];
  if (ctx) playHead = ctx.currentTime;
}

async function handleMessage(event) {
  const text = typeof event.data === 'string' ? event.data : await event.data.text();
  let msg;
  try { msg = JSON.parse(text); } catch (e) { return; }
  if (msg.setupComplete) { setStatus('🟢 Connected. Speak in Japanese!'); return; }
  const sc = msg.serverContent;
  if (sc) {
    if (sc.interrupted) stopPlayback();
    if (sc.inputTranscription && sc.inputTranscription.text) addLog('You', sc.inputTranscription.text);
    if (sc.outputTranscription && sc.outputTranscription.text) addLog('AI', sc.outputTranscription.text);
    const parts = (sc.modelTurn && sc.modelTurn.parts) || [];
    for (const p of parts) {
      if (p.inlineData && p.inlineData.data && (p.inlineData.mimeType || '').startsWith('audio/')) playPcm(p.inlineData.data);
    }
  }
  if (msg.goAway) setStatus('Server will close soon: ' + JSON.stringify(msg.goAway));
}

async function start() {
  const key = $('key').value.trim();
  if (!key) { setStatus('Paste your key first.', true); return; }
  stop();
  try {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    await ctx.resume();
    stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, channelCount: 1 } });
  } catch (e) {
    setStatus('Microphone error: ' + e.name + ' ' + e.message, true);
    return;
  }
  logText = ''; lastSpeaker = ''; $('log').textContent = '';
  setStatus('Connecting…');
  ws = new WebSocket(WS_BASE + '?key=' + encodeURIComponent(key));
  ws.onopen = () => {
    ws.send(JSON.stringify({ setup: {
      model: 'models/' + $('model').value,
      generationConfig: { responseModalities: ['AUDIO'] },
      systemInstruction: { parts: [{ text: SYSTEM }] },
      inputAudioTranscription: {},
      outputAudioTranscription: {},
    } }));
    source = ctx.createMediaStreamSource(stream);
    processor = ctx.createScriptProcessor(4096, 1, 1);
    sink = ctx.createGain(); sink.gain.value = 0;
    processor.onaudioprocess = (e) => {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      if ($('halfDuplex').checked && aiSpeaking()) return;
      const pcm = to16kPcm(e.inputBuffer.getChannelData(0), ctx.sampleRate);
      ws.send(JSON.stringify({ realtimeInput: { audio: { data: toBase64(pcm), mimeType: 'audio/pcm;rate=16000' } } }));
    };
    source.connect(processor); processor.connect(sink); sink.connect(ctx.destination);
  };
  ws.onmessage = handleMessage;
  ws.onerror = () => setStatus('Connection error (see the close reason below).', true);
  ws.onclose = (e) => {
    setStatus('Disconnected. Code ' + e.code + (e.reason ? ': ' + e.reason : ''), e.code !== 1000);
    cleanupAudio();
  };
}

function cleanupAudio() {
  try { processor && processor.disconnect(); } catch (e) {}
  try { source && source.disconnect(); } catch (e) {}
  if (stream) stream.getTracks().forEach(t => t.stop());
  processor = source = stream = null;
}

function stop() {
  stopPlayback();
  if (ws) { try { ws.close(1000); } catch (e) {} ws = null; }
  cleanupAudio();
  if (ctx) { try { ctx.close(); } catch (e) {} ctx = null; }
}

$('start').onclick = start;
$('stop').onclick = () => { stop(); setStatus('Stopped'); };
</script>
</body>
</html>
