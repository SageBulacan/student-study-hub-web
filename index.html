<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/student-study-hub-web/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Offline-first Japanese learning app for students.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Study Hub">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Student Study Hub</title>
  <link rel="manifest" href="manifest.json">

  <!-- Required by syncfusion_flutter_pdfviewer for rendering PDFs on web. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.6.347/pdf.min.js"></script>
  <script type="text/javascript">
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.6.347/pdf.worker.min.js";

    // Renders every page of a PDF (given as raw bytes) into <canvas>
    // elements appended to the container div — a custom, in-app viewer with
    // no native browser PDF chrome, so there's no built-in Save/Download
    // button exposed to the student (unlike opening the PDF directly via
    // the browser's own PDF viewer).
    window.renderPdfToContainer = async function (containerId, bytes) {
      const container = document.getElementById(containerId);
      if (!container) return;
      container.innerHTML = '';
      container.oncontextmenu = function () { return false; };
      container.style.overflow = 'auto';
      container.style.touchAction = 'pan-x pan-y';

      // Wrapper that gets transformed (scaled/panned) for zoom, separate
      // from the scrolling container itself.
      const wrapper = document.createElement('div');
      wrapper.style.transformOrigin = '0 0';
      wrapper.style.willChange = 'transform';
      container.appendChild(wrapper);

      const pdf = await pdfjsLib.getDocument({ data: bytes }).promise;
      for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
        const page = await pdf.getPage(pageNum);
        const viewport = page.getViewport({ scale: 1.5 });
        const canvas = document.createElement('canvas');
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        canvas.style.display = 'block';
        canvas.style.margin = '0 auto 14px auto';
        canvas.style.maxWidth = '100%';
        canvas.style.height = 'auto';
        canvas.style.boxShadow = '0 2px 8px rgba(0,0,0,0.18)';
        canvas.oncontextmenu = function () { return false; };
        const ctx = canvas.getContext('2d');
        await page.render({ canvasContext: ctx, viewport: viewport }).promise;
        wrapper.appendChild(canvas);
      }

      // Listeners are tied to an AbortController so re-rendering into the
      // same container (opening another PDF) removes the previous render's
      // handlers instead of stacking duplicates, which would otherwise keep
      // acting on a detached wrapper.
      if (container._pdfZoomAbort) container._pdfZoomAbort.abort();
      const ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
      container._pdfZoomAbort = ctrl;

      // --- Zoom + pan ---
      // Zoom resizes the page column itself (real layout size) instead of
      // using CSS transform: scale(). The previous transform-based version
      // computed the pinch focal point without accounting for how far the
      // container was already scrolled, so pinching while deep in a long
      // PDF (e.g. page 6) threw the view to a completely different page,
      // and a transform also can't grow the scrollable area, which forced a
      // hand-rolled pan that fought the container's own scrolling.
      // With layout zoom, native scrolling handles panning (with momentum),
      // and the focal point is read from the wrapper's actual on-screen
      // rect, so it's correct at any scroll position.
      const MIN_ZOOM = 1;
      const MAX_ZOOM = 4;
      let scale = 1;

      const canvases = Array.from(wrapper.querySelectorAll('canvas'));
      const maxIntrinsicWidth = Math.max(1, ...canvases.map(function (c) { return c.width; }));
      canvases.forEach(function (c) {
        c.style.width = '100%';
        c.style.maxWidth = 'none';
        c.style.height = 'auto';
        // Gap between pages scales with zoom too, so total content height
        // scales uniformly and the focal point math stays exact.
        c.style.margin = '0 0 calc(14px * var(--pdf-zoom, 1)) 0';
      });
      wrapper.style.transform = 'none';
      wrapper.style.willChange = 'auto';
      wrapper.style.margin = '0 auto';

      function applyZoom() {
        wrapper.style.setProperty('--pdf-zoom', String(scale));
        wrapper.style.width = 'calc(min(100%, ' + maxIntrinsicWidth + 'px) * ' + scale + ')';
        if (!wrapper.style.width) wrapper.style.width = (scale * 100) + '%';
      }
      applyZoom();

      // Fractions (0..1) of the wrapper's size at a given screen point.
      function anchorFromPoint(clientX, clientY) {
        const r = wrapper.getBoundingClientRect();
        return {
          fx: r.width > 0 ? (clientX - r.left) / r.width : 0.5,
          fy: r.height > 0 ? (clientY - r.top) / r.height : 0.5,
        };
      }

      // Sets a new zoom level, then scrolls so the content point described
      // by (fx, fy) ends up under screen point (targetX, targetY). Passing
      // the fingers' CURRENT midpoint as the target makes two-finger
      // panning during a pinch work with the same code path.
      function zoomAnchored(newScale, fx, fy, targetX, targetY) {
        newScale = Math.min(Math.max(newScale, MIN_ZOOM), MAX_ZOOM);
        if (newScale !== scale) {
          scale = newScale;
          applyZoom();
        }
        const r = wrapper.getBoundingClientRect(); // forces layout
        container.scrollLeft += (r.left + fx * r.width) - targetX;
        container.scrollTop += (r.top + fy * r.height) - targetY;
      }

      const listenerOpts = ctrl ? { signal: ctrl.signal } : {};
      const passiveOpts = ctrl ? { signal: ctrl.signal, passive: true } : { passive: true };
      const nonPassiveOpts = ctrl ? { signal: ctrl.signal, passive: false } : { passive: false };

      // Block iOS/WebKit's own page-level pinch gesture inside the viewer.
      ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (type) {
        container.addEventListener(type, function (e) { e.preventDefault(); }, nonPassiveOpts);
      });

      let pinch = null; // { startDist, startScale, fx, fy }
      let pendingFrame = null;
      let latestPinch = null;

      // Tap tracking, so a double-tap is only recognized for two quick,
      // stationary, single-finger taps -- not for the end of a pinch or
      // of a scroll drag.
      let multiTouchInGesture = false;
      let tapMoved = false;
      let tapStartX = 0, tapStartY = 0;
      let lastTapTime = 0, lastTapX = 0, lastTapY = 0;

      function fingerMetrics(touches) {
        const a = touches[0], b = touches[1];
        return {
          dist: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY),
          midX: (a.clientX + b.clientX) / 2,
          midY: (a.clientY + b.clientY) / 2,
        };
      }

      container.addEventListener('touchstart', function (e) {
        if (e.touches.length >= 2) {
          multiTouchInGesture = true;
          const m = fingerMetrics(e.touches);
          const anchor = anchorFromPoint(m.midX, m.midY);
          pinch = { startDist: Math.max(m.dist, 1), startScale: scale, fx: anchor.fx, fy: anchor.fy };
        } else if (e.touches.length === 1 && !multiTouchInGesture) {
          tapMoved = false;
          tapStartX = e.touches[0].clientX;
          tapStartY = e.touches[0].clientY;
        }
      }, passiveOpts);

      container.addEventListener('touchmove', function (e) {
        if (pinch && e.touches.length >= 2) {
          e.preventDefault();
          const m = fingerMetrics(e.touches);
          latestPinch = { scale: pinch.startScale * (m.dist / pinch.startDist), midX: m.midX, midY: m.midY };
          if (pendingFrame === null) {
            pendingFrame = requestAnimationFrame(function () {
              pendingFrame = null;
              if (pinch && latestPinch) {
                zoomAnchored(latestPinch.scale, pinch.fx, pinch.fy, latestPinch.midX, latestPinch.midY);
              }
            });
          }
        } else if (e.touches.length === 1 && !multiTouchInGesture) {
          // One finger: leave it to native scrolling; just note whether it
          // moved too far to still count as a tap.
          if (Math.hypot(e.touches[0].clientX - tapStartX, e.touches[0].clientY - tapStartY) > 10) {
            tapMoved = true;
          }
        }
      }, nonPassiveOpts);

      container.addEventListener('touchend', function (e) {
        if (e.touches.length < 2) pinch = null;
        if (e.touches.length > 0) return; // other fingers still down

        const wasCleanTap = !multiTouchInGesture && !tapMoved;
        multiTouchInGesture = false;
        if (!wasCleanTap) return;

        const t = e.changedTouches[0];
        const now = Date.now();
        const isDoubleTap = (now - lastTapTime) < 300
          && Math.hypot(t.clientX - lastTapX, t.clientY - lastTapY) < 40;

        if (isDoubleTap) {
          lastTapTime = 0;
          const anchor = anchorFromPoint(t.clientX, t.clientY);
          zoomAnchored(scale > 1.05 ? 1 : 2, anchor.fx, anchor.fy, t.clientX, t.clientY);
        } else {
          lastTapTime = now;
          lastTapX = t.clientX;
          lastTapY = t.clientY;
        }
      }, listenerOpts);

      container.addEventListener('touchcancel', function () {
        pinch = null;
        multiTouchInGesture = false;
      }, listenerOpts);

      // Desktop: Ctrl + wheel / trackpad pinch.
      container.addEventListener('wheel', function (e) {
        if (!e.ctrlKey) return;
        e.preventDefault();
        const anchor = anchorFromPoint(e.clientX, e.clientY);
        zoomAnchored(scale * Math.exp(-e.deltaY * 0.01), anchor.fx, anchor.fy, e.clientX, e.clientY);
      }, nonPassiveOpts);
    };
  </script>
  <script>
    // Called ONLY when the user explicitly taps "Refresh Now" in the app's
    // update banner (never automatically) — purges the service worker +
    // cache storage, then reloads once to fetch the latest deployed build.
    // Manual, user-triggered refresh avoids the reload-loop bug we hit
    // earlier with fully automatic update detection on iOS standalone PWAs.
    window.forceAppRefresh = function () {
      // Force-refetch the critical shell files with {cache: 'reload'} FIRST,
      // bypassing the browser's low-level HTTP cache (a layer separate from
      // -- and invisible to -- the Cache Storage API cleared below). Without
      // this, the newly re-registered service worker's own precache fetch
      // for these files can silently pull a stale copy back out of HTTP
      // cache even right after Cache Storage was fully cleared -- this was
      // the cause of "Refresh Now" appearing to do nothing in standalone
      // (Add to Home Screen) mode, since that context seems less likely to
      // have its HTTP cache separately cleared than a regular browser tab.
      var basePath = window.location.pathname.replace(/[^/]*$/, '');
      var baseUrl = window.location.origin + basePath;
      // The icon fonts and manifests are refreshed too, not just the code: the
      // icon font is tree-shaken to only the icons the app uses, so it
      // changes whenever an update adds a new icon. If a stale copy is kept
      // in cache, the new code arrives but the new icon shows up blank.
      // (The big KleeOne text fonts are left out on purpose: ~2 MB each and
      // they almost never change.)
      var criticalFiles = [
        '', 'main.dart.js', 'flutter_bootstrap.js', 'flutter_service_worker.js',
        'assets/FontManifest.json', 'assets/AssetManifest.bin',
        'assets/fonts/MaterialIcons-Regular.otf',
        'assets/packages/cupertino_icons/assets/CupertinoIcons.ttf'
      ];
      var refetchTasks = criticalFiles.map(function (f) {
        return fetch(baseUrl + f, { cache: 'reload' }).catch(function () {});
      });

      Promise.all(refetchTasks).then(function () {
        var tasks = [];
        if (window.caches) {
          tasks.push(caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (k) { return caches.delete(k); }));
          }));
        }
        if (navigator.serviceWorker) {
          tasks.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
            return Promise.all(regs.map(function (r) { return r.unregister(); }));
          }));
        }
        return Promise.all(tasks);
      }).then(function () {
        // A plain location.reload() can still be served from the browser's
        // regular HTTP cache -- appending a cache-busting query param
        // forces a genuinely fresh navigation instead.
        window.location.href = window.location.origin + window.location.pathname + '?refresh=' + Date.now();
      });
    };
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
