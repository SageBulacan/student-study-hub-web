<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/student-study-hub-web/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Offline-first Japanese learning app for students.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Study Hub">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Student Study Hub</title>
  <link rel="manifest" href="manifest.json">

  <!-- Required by syncfusion_flutter_pdfviewer for rendering PDFs on web. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.6.347/pdf.min.js"></script>
  <script type="text/javascript">
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.6.347/pdf.worker.min.js";
  </script>
  <script>
    // Detects a new app version (via version.json) on every launch,
    // including when opened from an "Add to Home Screen" icon on iOS —
    // those run as isolated standalone PWAs with their own cache that
    // survives clearing Safari's regular browsing data. On a version
    // change, this purges the service worker + cache storage and reloads
    // once, so a stale install picks up the new build automatically
    // instead of requiring the icon to be deleted and re-added by hand.
    (function () {
      var STORAGE_KEY = 'sshub_app_version';
      fetch('version.json', { cache: 'no-store' })
        .then(function (res) { return res.json(); })
        .then(function (data) {
          var latest = (data.latestVersionName || '') + '+' + (data.latestVersionCode || '');
          var stored = localStorage.getItem(STORAGE_KEY);
          if (stored && stored !== latest) {
            var tasks = [];
            if (window.caches) {
              tasks.push(caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (k) { return caches.delete(k); }));
              }));
            }
            if (navigator.serviceWorker) {
              tasks.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(regs.map(function (r) { return r.unregister(); }));
              }));
            }
            Promise.all(tasks).then(function () {
              localStorage.setItem(STORAGE_KEY, latest);
              location.reload();
            });
          } else {
            localStorage.setItem(STORAGE_KEY, latest);
          }
        })
        .catch(function () { /* offline on first load — just proceed normally */ });
    })();
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
